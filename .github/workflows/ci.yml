name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local PostgreSQL
        run: pnpm db:up

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply migrations to an empty test database
        run: pnpm db:deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://spc_migrator:local_migration_password@127.0.0.1:5433/supplier_price_control_test?schema=app

      - name: Verify migration replay is a no-op
        run: pnpm db:deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://spc_migrator:local_migration_password@127.0.0.1:5433/supplier_price_control_test?schema=app

      - name: Check migration history matches the Prisma schema
        run: pnpm db:check
        env:
          MIGRATION_DATABASE_URL: postgresql://spc_migrator:local_migration_password@127.0.0.1:5433/supplier_price_control_test?schema=app
          SHADOW_DATABASE_URL: postgresql://spc_migrator:local_migration_password@127.0.0.1:5433/supplier_price_control_shadow?schema=app

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL constraints and runtime permissions
        run: pnpm db:test
        env:
          TEST_DATABASE_URL: postgresql://spc_app:local_app_password@127.0.0.1:5433/supplier_price_control_test?schema=app

      - name: Test authentication and organization isolation
        run: pnpm auth:test
        env:
          TEST_DATABASE_URL: postgresql://spc_app:local_app_password@127.0.0.1:5433/supplier_price_control_test?schema=app

      - name: Build
        run: pnpm build

      - name: Stop local PostgreSQL
        if: always()
        run: pnpm db:down
